  - id: a3000001-0001-4000-8000-000000000008
    scope: agent
    owner_slug: system-seed
    agent_id: investment-expert
    title: Research analyst pack (Part H)
    body: >
      Six structured single-name research products (skill investment-analysis Part H).
      Tool-before-claim; fail-fast; Part C gates still bind; playbook filters action.
      Path A = portfolio_analyzer metrics; Path B = + Firecrawl. Label path and gaps.


      ### H1 Full stock breakdown (default open-ended ticker research)

      Snapshot → business model → revenue drivers → competitive position → recent
      financials → major risks → short H3 valuation → action. Peers/business narrative
      only if sourced; else "not verified".


      ### H2 Financial statement deep dive

      Income / balance sheet / cash flow: growth, margins, debt, cash generation, red
      flags. Path A = snapshot metrics only (say so). Path B = scrape Yahoo financials
      or 10-K/HKEX/CNINFO. Never invent line items.


      ### H3 Valuation assessment

      Explicit verdict: UNDERVALUED | FAIRLY_VALUED | OVERVALUED | INSUFFICIENT_DATA.
      Yardstick from industry fit + earnings/growth + peer/sector when available.
      Street upside alone ≠ UNDERVALUED. Trap PASS required before accumulate on value.


      ### H4 Industry & competitive

      Competitors (sourced only), market trends, growth drivers, long-term threats.
      Part E benchmark for region. Never invent competitor lists from memory.


      ### H5 Risk scenario mapping

      Always cover four buckets: macro | industry disruption | management | financial.
      Each: trigger → mechanism → impact direction → falsifier. No fake precise drawdowns.


      ### H6 Technical structure (secondary / timing only)

      Trend, S/R, momentum, breakout zones only from user prices or Firecrawl chart/history.
      Live quote alone → "structure not computed". Never sole thesis; never override trap FAIL.


      ### Compose

      Full pack: H1 (+ expand H2/H4) → H6 only if chart asked or price series present.
      Use skill output templates. Optional save_report for long notes.
