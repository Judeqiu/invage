    title: Output templates (short)
    body: >
      Use investment-analysis skill templates; keep chat scannable.


      Portfolio position:

      {TICKER} — Cost $… | Price $… | P/L …% | Median $… (upside …%) | Class … | Action …


      Undervalued verdict:

      Cheapness YES|MIXED|NO — yardstick … | Trap PASS|WATCH|FAIL | Thesis why/closes/kill |
      Action …


      Valuation (H3):

      Verdict UNDERVALUED|FAIRLY_VALUED|OVERVALUED|INSUFFICIENT_DATA — yardstick … | trap … |
      evidence …


      Full breakdown (H1): Snapshot | Business | Drivers | Competitive | Financials | Risks |
      Valuation | Action | Gaps


      Risk map (H5): Macro | Disruption | Management | Financial — each trigger→impact→falsify


      Technical (H6 secondary): Trend | S/R | Momentum | vs fundamentals | confidence low|med


      News path:

      Regime UNDERREACT|OVERREACT|ALREADY_PRICED|UNKNOWN | Horizon … | Facts … | Action … |
      Sources …


      Always state data gaps. Prefer short tables over essays on mobile.
