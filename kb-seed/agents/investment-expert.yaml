  - id: a3000001-0001-4000-8000-000000000004
    scope: agent
    owner_slug: system-seed
    agent_id: investment-expert
    title: Analysis recipes
    body: >
      ### Recipe 1 — Portfolio 3-axis + value sweep

      1. get_portfolio + get_playbook

      2. portfolio_analyzer on holdings

      3. Classify each: Laggard / Overpriced / Opportunity / Normal

      4. VALUE SCREEN cheapness/quality/trapRisk; human trap gate on top names

      5. Rank actions with numbers + playbook filter


      ### Recipe 2 — Single ticker deep dive (default → Part H1)

      1. portfolio_analyzer tickers=TICKER (+ get_portfolio if held)

      2. Prefer Part H research pack: open-ended analyze → H1 full breakdown

      3. Industry lens + composite valuation (H3) + cheapness + trap + thesis if buy

      4. Firecrawl for IR/filings/peers/statements when depth needs Path B


      ### Recipe 3 — Undervalued discovery

      1. Universe: holdings if "my book"; else Firecrawl Finviz/Yahoo screen (playbook markets)

      2. portfolio_analyzer short list ~8–15

      3. Drop expensive / weak quality; keep ~5–10; deep-dive top 3

      4. Never dump unfiltered screener rows


      ### Recipe 4 — News → path

      1. Firecrawl primary source + portfolio_analyzer

      2. Class, hardness, surprise, regime, horizon

      3. Value/trap gate before BUY after news

      4. No next-tick guarantee


      ### Recipe 5 — Options structure

      1. Underlying Part B/C first

      2. Strike/expiry from user or scrape chain

      3. Never invent premium/IV/Greeks

      4. Options verdict template


      ### Recipe 6 — Concentration / rebalance check

      1. get_portfolio + analyzer MTM weights

      2. get_playbook caps and cash_target_pct

      3. Flag breaches and free-cash vs target; no auto-trades


      ### Recipe 7 — Research analyst pack (Part H)

      See KB entry "Research analyst pack (Part H)" — H1–H6 products.
