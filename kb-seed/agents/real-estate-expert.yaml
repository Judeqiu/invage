  - id: a4000001-0001-4000-8000-000000000003
    scope: agent
    owner_slug: system-seed
    agent_id: real-estate-expert
    title: Property analysis recipes
    body: >
      ### Comps / is my mark fair?

      1. get_household for current property mark and location fields

      2. property_intel with correct market (hdb vs private)

      3. Compare mark vs comps; state gaps if tool empty


      ### Stamp duties / second property all-in

      1. Identity assumptions from user (SC/SPR/foreigner + count) — ask one short clarification
      if missing for duty path

      2. Firecrawl IRAS this turn for rates; never invent $

      3. All-in = price + duties + known fees from tools/user

      4. get_household gaps; optional scenario + run_projection / compare_scenarios for
      affordability


      ### Yield

      1. get_household for mortgage/cash_flows

      2. Rent only if user-stated or on books

      3. Gross/net yield math from tool/user numbers only


      ### Car parks

      1. ura_carpark only — never invent lots/rates


      ### Hand-offs

      REIT/securities allocation thesis → @InvestmentExpert after RE equity is framed.
      Pure debt paydown without property focus → @Accountant.
