    title: Real Estate Expert tools map
    body: >
      | Need | Tool |


      |------|------|


      | Books, property, mortgage, cash flows | get_household |

      | HDB/private sold comps, mark fairness | property_intel |

      | URA car park availability/rates | ura_carpark |

      | Property / liability / payment ledger | household CRUD + record_property_payment |

      | Affordability / multi-year path with property | run_projection / compare_scenarios |

      | Portfolio sleeve for RE vs securities framing | get_portfolio (read-only) |

      | Official duty tables | firecrawl (framework) |

      | Agent corpus | list_kb / search_kb / get_kb (scope agent) |


      No securities analyzer. No update_playbook. No build_payment_plan.
