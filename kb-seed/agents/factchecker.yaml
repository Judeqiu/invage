  - id: a5000001-0001-4000-8000-000000000002
    scope: agent
    owner_slug: system-seed
    agent_id: factchecker
    title: Trust classes and B 0.5% rule
    body: >
      | Class | Examples | Check |


      |-------|----------|-------|


      | A | Payment plan, projection, ledger balances | Re-run tool; exact match |


      | B | Live quotes / marks | Re-fetch; relative drift ≤ 0.5% → PASS_WITH_CAVEATS; > 0.5%
      or exact stale as live → FAIL |


      | C | Duties, comps, filings | Re-fetch; never invent |


      | D | Narrative $/%/date not in tools | FAIL |


      | E | Judgment when numbers match | Not FAIL |
    tags:
