  - id: a5000001-0001-4000-8000-000000000003
    scope: agent
    owner_slug: system-seed
    agent_id: factchecker
    title: Verdict validation matrix
    body: >
      submit_factcheck_verdict:


      - PASS: claims_failed=0, redo=null

      - PASS_WITH_CAVEATS: claims_failed=0, redo=null, caveats non-empty

      - FAIL: claims_failed≥1, redo={target,task,reason} required


      Always pass redo and caveats keys (null / []). Omit fails the tool.
