    title: REDO target map
    body: >
      Wrong ledger/journal → bookkeeper. Wrong paydown HARD cost → financial-planner. Wrong quote or
      thesis number → investment-advisor. Wrong duty/comps → real-estate-expert. Host re-routes;
      Factchecker never nested-invokes craft peers.
