  - id: a5000001-0001-4000-8000-000000000004
    scope: agent
    owner_slug: system-seed
    agent_id: factchecker
    title: Tools map and journal n/a
    body: >
      Read tools: get_portfolio, list_journal_entries (conditional), get_household, get_treasury,
      list_cash_flows, get_projection_assumptions, get_playbook, get_scenario, list_scenarios,
      run_projection, compare_scenarios, get_quote, portfolio_analyzer, build_payment_plan,
      estimate_opportunity_cost, property_intel, ura_carpark, submit_factcheck_verdict.


      Denylist: all ledger writes, optimize_payment_plan, save_report, update_playbook, snapshots.


      list_journal_entries only when journal/reconcile claims or books_journal_expected. If books
      DB unset → journal n/a — do not whole-audit FAIL solely for missing INVAGE_BOOKS_DATABASE_URL.
