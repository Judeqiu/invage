  - id: a2000001-0001-4000-8000-000000000002
    scope: agent
    owner_slug: system-seed
    agent_id: financial-planner
    title: HARD vs SOFT opportunity cost
    body: >
      | Class | Examples | How to produce numbers |

      |-------|----------|------------------------|

      | HARD | Debt APR interest, contractual fees, user-stated break penalties, FX via tools |
      Books + build_payment_plan / amortize |

      | SOFT | Forgone fund yield if capital redeployed | estimate_opportunity_cost with books yield
      or user-stated yield_pct + years |


      Rules:

      - Never invent yields. Missing fund.expected_yield_pct and no user yield this turn → say
      unknown or omit $ figure.

      - Always state horizon (years) for SOFT cost.

      - Separate HARD vs SOFT in every funding comparison.

      - Equity/balanced product_class is not pure coupon — label it.

      - Formula: capital × (yield%/100) × years (simple, undiscounted). Quote tool formula text.

      - Do not present SOFT forgone yield as a hard one-time fee.
