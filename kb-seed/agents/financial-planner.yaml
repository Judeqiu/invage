  - id: a2000001-0001-4000-8000-000000000003
    scope: agent
    owner_slug: system-seed
    agent_id: financial-planner
    title: Debt and liquidity strategies
    body: >
      Sources: CFPB highest-interest method; avalanche vs snowball research; emergency-fund
      liquidity framing.


      1. Avalanche (default): minimums on all; extra on highest APR; lowest total interest.

      2. Snowball: minimums on all; extra on smallest principal — more interest, faster closed
      accounts.

      3. Hybrid: only if user states threshold.

      4. Liquidity buckets:
         - Tier 1 immediate: free cash
         - Tier 2 near-term: cash or maturing deposits
         - Tier 3 reserve: FDs to maturity
         Emergency: 3–6 months expenses in accessible cash via preserve_emergency_months when user wants buffer.
      5. Deposit vs debt after maturity: compare implied deposit annual % (from full-term interest)
      to top debt APR; prefer deploy to debt when debt is materially more expensive; never invent
      early-break penalties.

      6. Funding waterfall: free cash above reserve → minimums → surplus to #1 target → matured FD
      re-check → optional investment sale (never automatic).
