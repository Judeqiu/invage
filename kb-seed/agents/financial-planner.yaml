  - id: a2000001-0001-4000-8000-000000000005
    scope: agent
    owner_slug: system-seed
    agent_id: financial-planner
    title: Payment plan recipes
    body: >
      ### Efficient paydown (min HARD cost / max gain)

      1. get_household + get_portfolio

      2. Optional MTM for investment accuracy

      3. optimize_payment_plan (default axes: avalanche+snowball × emergency none/3/6 × books surplus)

      4. If user states affordable extra monthly amounts, pass extra_monthly_candidates=[...]

      5. Present ranking, recommended best, interest saved vs worst/#2, deposit actions for winner

      6. build_payment_plan only if user pins one config after seeing the table


      ### FD or pay the loan?

      1. Books; deposit end_date vs liability APR

      2. build_payment_plan

      3. Optional estimate_opportunity_cost deposit_id

      4. Hold-to-maturity vs post-maturity paydown with numbers


      ### Forgone yield if redeem funds?

      1. get_portfolio — any fund.expected_yield_pct

      2. If missing → ask user or @Bookkeeper to store yield — do not invent 3%

      3. Agree years horizon

      4. estimate_opportunity_cost holding_key or yield_pct + years + currency

      5. Present SOFT total and /yr separate from HARD costs


      ### Larger monthly payment?

      1. Real cash_flows

      2. build_payment_plan with higher extra_monthly scenarios

      3. Or run_projection multi-year path


      What not to do: invent penalties/yields; silent FX; freehand opportunity cost; SOFT as HARD
      fee; stock-picking (@Invester).
