  - id: a2000001-0001-4000-8000-000000000004
    scope: agent
    owner_slug: system-seed
    agent_id: financial-planner
    title: FinancialPlanner tools map
    body: >
      | Need | Tool |

      |------|------|

      | Books + gaps | get_household |

      | Cash / deposits / holdings | get_portfolio |

      | Live marks | get_quote, portfolio_analyzer |

      | Best plan (multi-combination search) | optimize_payment_plan |

      | Single pinned schedule | build_payment_plan |

      | SOFT opportunity cost | estimate_opportunity_cost |

      | Multi-year path | run_projection / compare_scenarios |

      | Agent corpus | list_kb / search_kb / get_kb (scope agent) |


      optimize_payment_plan (preferred for recommendations):

      - Cartesian product: strategies × emergency_months_candidates × extra_monthly_candidates

      - Default axes when omitted: avalanche+snowball; emergency none/3/6; extra = books surplus

      - Ranks by HARD total_interest (min), then months_to_debt_free, then total_paid

      - Returns ranked table + full best plan; SOFT cost never mixed in

      - Cap 48 candidates — narrow axes if over limit; never invent extra amounts user cannot fund


      build_payment_plan: one config only — strategy avalanche|snowball; preserve_emergency_months;
      extra_monthly; max_months. Use after optimize or when user pins a config.


      estimate_opportunity_cost:

      - years required; currency required

      - yield_pct explicit OR deposit_id (implied yield) OR holding_key with fund.expected_yield_pct

      - capital required unless deposit/holding supplies it

      - Fail if no yield source — never invent
