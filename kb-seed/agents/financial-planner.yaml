  - id: a2000001-0001-4000-8000-000000000006
    scope: agent
    owner_slug: system-seed
    agent_id: financial-planner
    title: Help-first and deferred re-plans
    body: >
      Help-first: convert payment/cash efficiency asks into a plan now; never flat reject.


      When the right check is after a date (FD maturity, bonus, rate reset):

      1. optimize_payment_plan (or build_payment_plan if config pinned) + estimate_opportunity_cost
      with what books allow today.

      2. create_task so host Invester re-consults financial-planner after that date with ids + criteria.

      3. Prefer telegram delivery when linked. Confirm next_run_at from tool result only.


      Never invent yields. Hand securities thesis to investment-advisor — hand-off is not rejection.
