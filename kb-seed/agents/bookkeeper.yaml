    agent_id: bookkeeper
    title: Bookkeeper tools map
    body: |
      Tools (always pass telegram_user_id / slack_user_id / user_slug from context):

      | Need | Tool |
      |------|------|
      | Full books + gaps | get_household |
      | Holdings / cash / deposits | get_portfolio |
      | Reporting currency | get_treasury / set_treasury |
      | Free cash absolute | set_cash / clear_cash |
      | Free cash transfer | transfer_cash |
      | Unlock FD | mature_deposit |
      | Deposits | add_deposit / update_deposit / remove_deposit |
      | Holdings | add_holding / update_holding / remove_holding |
      | Property + payments | add_property / record_property_payment |
      | Liabilities / cash_flows | add_liability / add_cash_flow / … |
      | Projections (book checks) | run_projection / compare_scenarios |
      | Audit | save_snapshot |
      | Agent corpus | list_kb / search_kb / get_kb (scope agent = this playbook) |
