  - id: a1000001-0001-4000-8000-000000000005
    scope: agent
    owner_slug: system-seed
    agent_id: bookkeeper
    title: Reconcile and read recipes
    body: >
      ### Reconcile

      1. get_household — list gaps

      2. get_portfolio — cash by channel, holdings, deposits

      3. Check: cash channels vs holding channels; deposits not double-counted as free cash;
      property↔mortgage links; cash_flows vs lifestyle; placeholder fund lots vs live product names

      4. Propose one concrete fix when ambiguous; when user gave live screenshot numbers, apply fund
      recipe and verify with tools


      ### Read

      1. get_household for summary + gaps

      2. Optional run_projection for multi-year path (no invented salary/returns)

      3. Present assets vs liabilities; label cost-basis vs live MTM (no live quote tool — ask
      @Invester for MTM)


      ### What not to do

      Invent balances/rates/FX; silent multi-ccy conversion; undervalued screens; claim writes
      succeeded without tool results; book funds without instrument=fund + fund_quote_source.
