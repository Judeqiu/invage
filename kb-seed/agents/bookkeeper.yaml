  - id: a1000001-0001-4000-8000-000000000003
    scope: agent
    owner_slug: system-seed
    agent_id: bookkeeper
    title: Cash and deposit journal recipes
    body: >
      ### Journal (record)

      1. Resolve user from context; never ask for ids.

      2. get_household and/or get_portfolio before mutating when books may exist.

      3. Write only what the user stated.

      4. Cash movement:
         - Transferred X A→B (same ccy) → transfer_cash
         - Matured FD → mature_deposit; then transfer_cash if wiring out
         - App shows cash = X → set_cash absolute for channel+currency
         - Never credit destination only for a transfer; never invent FX
      5. Condo OTP/booking: add_property if missing, record_property_payment with cash_channel when
      funded from free cash.

      6. Confirm with tool output.


      ### Repair one-leg transfer / double-count

      1. Prefer absolute balances from bank UI: set_cash per (channel, currency) +
      update_deposit(..., adjust_cash=false) for true FD principal.

      2. Do not mature_deposit on top of already-credited destination for the same physical move.

      3. After fix, summarize every free-cash slot from tools.
