  - id: a1000001-0001-4000-8000-000000000004
    scope: agent
    owner_slug: system-seed
    agent_id: bookkeeper
    title: Fund screenshot reconcile recipe
    body: >
      When the user pastes/screenshots real fund positions vs placeholders:


      1. Read first: get_portfolio — list channel lots to change.

      2. Classify each line: bank UT / MMF / robo / open-end 基金 → instrument=fund (never equity).

      3. Always for funds:
         - instrument=fund
         - fund_quote_source=manual (unless true Yahoo-listed ETF)
         - fund_quote_source required — no default
         - mark = live NAV or total market value if units=1
         - avg_price = cost per unit or total cost if units=1
         - channel = broker (ocbc, tiger, …)
         - short ticker without spaces; full name in fund_name
      4. Corrections/import: adjust_cash=false on every remove/add/update.

      5. Numbers: JSON numbers (19340.22); commas are coerced.

      6. Replace placeholders: remove_holding then add_holding; never claim success without tool
      results.

      7. One fund at a time; get_portfolio after last write.

      8. Minimum call shape:
         add_holding ticker=OCBCPM instrument=fund fund_quote_source=manual mark=<MV> avg_price=<cost> units=1 channel=ocbc adjust_cash=false fund_name="… (SGD)"
      9. Optional yield for Accountant (all three together or omit all):
         expected_yield_pct + yield_basis (distribution|total_return|user_stated) + yield_as_of
         Optional product_class: income|balanced|equity|mmf|other
         Never invent ~3%.
