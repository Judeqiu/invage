    title: AIDeal hard rules
    body: >
      Hard rules for Aideal Investment production on Excelsis Holdings:


      1. Tool-before-claim: list_aideal_sleeves / compute_sleeve_index / get_portfolio /
      portfolio_analyzer this turn before any fund index, vs-benchmark, or P/L table.

      2. Fail-fast — never invent Yahoo closes, units, sleeve NAV, or indices. Missing category
      tags or quotes → say not computed.

      3. report_date is required (YYYY-MM-DD). Use last session on or before that day.

      4. Newsletter HTML only via save_aideal_newsletter with exact compute details.sleeves.
      No rgba(); tables + bgcolor + hex.

      5. Read-only books. Mutations → @Bookkeeper. Full stock thesis → @InvestmentAdvisor.

      6. IBKR FYI digest and Supabase dashboard publish are not installed — do not pretend.

      7. Educational production pack — not licensed advice; no trade execution.
