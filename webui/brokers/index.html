<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Brokers</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --radius: 0.65rem;
      --background: oklch(0.985 0.006 250);
      --foreground: oklch(0.24 0.035 265);
      --ink: oklch(0.17 0.045 265);
      --card: oklch(1 0 0);
      --muted: oklch(0.955 0.014 260);
      --muted-foreground: oklch(0.53 0.035 265);
      --border: oklch(0.905 0.02 262);
      --brand: oklch(0.55 0.24 278);
      --brand-2: oklch(0.68 0.17 205);
      --success: oklch(0.63 0.19 155);
      --warning: oklch(0.74 0.17 72);
      --danger: oklch(0.585 0.245 22);
      --gradient-brand: linear-gradient(120deg, var(--brand), var(--brand-2));
      --shadow-card: 0 1px 2px oklch(0.24 0.06 265 / 0.06), 0 12px 30px -18px oklch(0.24 0.12 265 / 0.35);
      --shadow-glow: 0 0 0 1px color-mix(in oklab, var(--brand) 22%, transparent),
        0 18px 40px -22px color-mix(in oklab, var(--brand) 60%, transparent);
      --font-serif: "Instrument Serif", ui-serif, Georgia, serif;
      --font-sans: "Inter", ui-sans-serif, system-ui, sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: var(--font-sans);
      background-color: var(--background);
      background-image:
        radial-gradient(900px 460px at 8% -10%, color-mix(in oklab, var(--brand) 12%, transparent), transparent 70%),
        radial-gradient(760px 400px at 100% 0%, color-mix(in oklab, var(--brand-2) 14%, transparent), transparent 68%);
      background-attachment: fixed;
      color: var(--foreground);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    h1, h2 { font-family: var(--font-serif); font-weight: 400; letter-spacing: -0.01em; }
    .label-eyebrow {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted-foreground);
    }
    .page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 1.5rem 1.25rem 2.5rem;
    }
    .breadcrumb { margin-bottom: 1.25rem; }
    .hero { max-width: 40rem; }
    .hero h1 { margin-top: 0.75rem; font-size: 2.25rem; color: var(--ink); }
    @media (min-width: 640px) { .hero h1 { font-size: 2.5rem; } }
    .hero p { margin-top: 1rem; font-size: 0.875rem; color: var(--muted-foreground); }
    .section-gap { margin-top: 3rem; margin-bottom: 1.1rem; }
    .section-gap h2 {
      margin-top: 0.25rem;
      font-size: 1.6rem;
      color: var(--ink);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .section-gap h2 .bar {
      display: inline-block;
      height: 1rem;
      width: 0.35rem;
      border-radius: 999px;
      background-image: var(--gradient-brand);
    }
    .grid-2 { display: grid; gap: 0.75rem; }
    @media (min-width: 768px) { .grid-2 { grid-template-columns: 1fr 1fr; } }
    .grid-3 { display: grid; gap: 0.75rem; }
    @media (min-width: 768px) { .grid-3 { grid-template-columns: 1fr 1fr 1fr; } }
    .metric-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 0.85rem;
      padding: 1.1rem 1.25rem;
      box-shadow: var(--shadow-card);
    }
    .metric-card:hover {
      border-color: color-mix(in oklab, var(--brand) 32%, var(--border));
      box-shadow: var(--shadow-glow);
    }
    .metric-card.soon {
      background: color-mix(in oklab, var(--muted) 70%, var(--card));
      border-color: color-mix(in oklab, var(--border) 80%, var(--muted));
      box-shadow: none;
      filter: grayscale(1);
      opacity: 0.62;
    }
    .metric-card.soon:hover {
      border-color: color-mix(in oklab, var(--border) 80%, var(--muted));
      box-shadow: none;
    }
    .metric-card.soon .card-name { color: var(--muted-foreground); }
    .card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 0.75rem; }
    .card-name { font-family: var(--font-serif); font-size: 1.65rem; color: var(--ink); }
    .card-sub { margin-top: 0.25rem; font-size: 0.75rem; color: var(--muted-foreground); }
    .pill {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 0.15rem 0.6rem;
      font-size: 0.72rem;
      font-weight: 600;
      white-space: nowrap;
    }
    .pill-success {
      background: color-mix(in oklab, var(--success) 15%, transparent);
      color: color-mix(in oklab, var(--success) 78%, black);
      box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--success) 40%, transparent);
    }
    .pill-warning {
      background: color-mix(in oklab, var(--warning) 22%, transparent);
      color: color-mix(in oklab, var(--warning) 60%, black);
      box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--warning) 50%, transparent);
    }
    .pill-danger {
      background: color-mix(in oklab, var(--danger) 16%, transparent);
      color: color-mix(in oklab, var(--danger) 82%, black);
      box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--danger) 42%, transparent);
    }
    .pill-muted { background: var(--muted); color: var(--muted-foreground); }
    .actions { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 1.25rem; }
    button {
      appearance: none;
      font-family: inherit;
      font-size: 0.75rem;
      font-weight: 600;
      border-radius: 0.4rem;
      padding: 0.4rem 0.75rem;
      cursor: pointer;
    }
    button.primary { background: var(--ink); color: #fff; border: 1px solid var(--ink); }
    button.ghost {
      background: transparent;
      color: var(--muted-foreground);
      border: 1px solid var(--border);
    }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .manage {
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
    }
    label.field { display: block; margin-top: 0.7rem; font-size: 0.72rem; font-weight: 600; color: var(--ink); }
    label.field .help { display: block; font-weight: 400; color: var(--muted-foreground); margin-top: 0.15rem; }
    input[type="text"], input[type="password"], textarea {
      width: 100%;
      margin-top: 0.3rem;
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      padding: 0.45rem 0.6rem;
      font-size: 0.875rem;
      background: #fff;
      color: var(--ink);
    }
    textarea { min-height: 5.5rem; font-family: var(--font-mono); }
    .toggle { display: flex; align-items: center; gap: 0.4rem; font-size: 0.8rem; margin-top: 0.75rem; }
    details { margin-top: 0.85rem; font-size: 0.75rem; color: var(--muted-foreground); }
    details ol { margin: 0.4rem 0 0 1.1rem; }
    details a { color: var(--brand); }
    .last { margin-top: 0.7rem; font-size: 0.75rem; color: var(--muted-foreground); }
    .error {
      color: color-mix(in oklab, var(--danger) 82%, black);
      background: color-mix(in oklab, var(--danger) 10%, transparent);
      border: 1px solid color-mix(in oklab, var(--danger) 30%, transparent);
      border-radius: 0.6rem;
      padding: 0.6rem 0.75rem;
      margin-bottom: 1rem;
      white-space: pre-wrap;
      font-size: 0.8125rem;
    }
    .import-title { font-size: 0.68rem; }
    .import-body { margin-top: 0.5rem; font-size: 0.875rem; color: var(--muted-foreground); }
  </style>
</head>
<body>
  <div class="page">
    <div class="breadcrumb label-eyebrow">Brokers / Secure connections</div>
    <div class="hero">
      <div class="label-eyebrow">Setup · one-time</div>
      <h1>Connect once. Sync on demand.</h1>
      <p>
        Read-only brokerage channels. Enable a card, paste credentials, Sync. Marks stay Yahoo. Invage never places or cancels orders.
      </p>
    </div>
    <div id="error" class="error" hidden></div>
    <div class="section-gap">
      <div class="label-eyebrow" style="color: var(--brand)">Section 01</div>
      <h2><span class="bar" aria-hidden="true"></span>Your brokerage connections</h2>
    </div>
    <div id="list" class="grid-2"></div>
    <div class="section-gap">
      <div class="label-eyebrow" style="color: var(--brand)">Section 02</div>
      <h2><span class="bar" aria-hidden="true"></span>What gets imported</h2>
    </div>
    <div class="grid-3" id="imports"></div>
  </div>
  <script src="app.js"></script>
</body>
</html>
