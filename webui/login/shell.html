<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#081322">
  <title>Login — Velovest</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="/login/form.css">
  <link rel="stylesheet" href="/domain-assets/invage/login/page.css">
</head>
<body>
  <main class="velovest-login">
    <section class="velovest-login__section" aria-labelledby="welcome-title">
      <a class="velovest-login__back" href="https://velovest.lextok.com/">← Back to Velovest Academy</a>
      <div class="velovest-login__panel">
        <div class="velovest-login__intro">
          <svg class="velovest-login__icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z"/><path d="M22 10v6"/><path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5"/></svg>
          <p class="velovest-login__eyebrow">Welcome back</p>
          <h1 id="welcome-title">Continue with context.</h1>
          <p class="velovest-login__copy">Return to your education and options intelligence workspace.</p>
        </div>
        <div class="velovest-login__form-panel">
          <!-- Utarus retains credential handling, sessions, errors, invites and return paths. -->
          <div id="utarus-login-root"><p>Loading sign in…</p></div>
          <noscript><p>Enable JavaScript to sign in to Velovest.</p></noscript>
          <p class="velovest-login__signup">New to Velovest? <a href="https://velovest.lextok.com/signup">Create an account</a></p>
        </div>
      </div>
    </section>
  </main>
  <script src="/login/embed.js" defer></script>
</body>
</html>
