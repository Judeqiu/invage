<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Trades</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../report.css" />
</head>
<body>
  <div class="page">
    <div class="breadcrumb label-eyebrow">Trades / Option executions</div>
    <div class="hero">
      <div class="label-eyebrow" id="eyebrow">Journal</div>
      <h1>Each trade, recorded separately.</h1>
      <p>Individual option premiums and exact signed commissions. Times use the broker report’s clock. Totals cover imported executions only, not lifetime performance.</p>
    </div>
    <div id="error" class="error" hidden></div>
    <div class="filters">
      <button type="button" class="chip-btn on" id="journal-view">Execution journal</button>
      <button type="button" class="chip-btn" id="positions-view">Open option positions</button>
      <label class="chip-btn">Import historical Flex XML <input id="history-file" type="file" accept=".xml,application/xml" /></label>
      <span id="import-result" role="status"></span>
    </div>
    <div class="filters" id="filters"></div>
    <div id="table"></div>
  </div>
  <script src="../report.js"></script>
  <script src="app.js"></script>
</body>
</html>
