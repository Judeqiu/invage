<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Watch List</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../report.css" />
  <style>
    :root {
      --bg: var(--background);
      --surface: #ffffff;
      --ink: #0f172a;
      --ink-muted: #64748b;
      --ink-soft: #94a3b8;
      --border: #e2e8f0;
      --border-strong: #cbd5e1;
      --accent: #1e293b;
      --positive: #047857;
      --negative: #b91c1c;
      --radius: 12px;
      --shadow: 0 1px 2px rgba(15, 23, 42, 0.04), 0 4px 16px rgba(15, 23, 42, 0.04);
      --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--ink);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    .header {
      background: transparent;
      color: var(--ink);
      padding: 1.25rem 1.5rem 1.1rem;
      text-align: left;
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid var(--border);
    }
    .header h1 { font-family: var(--font-serif); font-size: 1.85rem; font-weight: 400; letter-spacing: -0.02em; }
    .header .subtitle { font-size: 0.8125rem; opacity: 0.72; margin-top: 0.3rem; }
    .controls {
      background: var(--surface);
      padding: 0.85rem 1.5rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-wrap: wrap;
      gap: 0.85rem 1.25rem;
      align-items: center;
      justify-content: center;
    }
    button {
      appearance: none;
      border: 1px solid var(--border-strong);
      background: var(--accent);
      color: #fff;
      border-radius: 8px;
      padding: 0.45rem 0.95rem;
      font-size: 0.8125rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .status {
      font-size: 0.75rem;
      color: var(--ink-muted);
      text-align: center;
      padding: 0.45rem 1rem 0;
      min-height: 1.15em;
    }
    .status.error { color: var(--negative); }
    .container { max-width: 1100px; margin: 0 auto; padding: 1.5rem 1.5rem 2rem; }
    .section { margin: 0 0 1.75rem; }
    .section-title {
      font-size: 1.05rem;
      font-weight: 650;
      letter-spacing: -0.01em;
      margin-bottom: 0.75rem;
    }
    .chip-block { margin-bottom: 0.85rem; }
    .chip-label {
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--ink-muted);
      margin-bottom: 0.4rem;
    }
    .chips { display: flex; flex-wrap: wrap; gap: 0.4rem; }
    .chip {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 0.28rem 0.7rem;
      font-size: 0.8125rem;
      font-weight: 600;
      box-shadow: var(--shadow);
    }
    .chip.muted { color: var(--ink-soft); font-weight: 500; }
    .table-wrap {
      overflow-x: auto;
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
    }
    table { width: 100%; border-collapse: collapse; font-size: 0.8125rem; }
    th, td {
      padding: 0.7rem 0.9rem;
      text-align: left;
      border-bottom: 1px solid #f1f5f9;
    }
    th {
      background: #f8fafc;
      color: #475569;
      font-weight: 650;
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    td.num, th.num { font-variant-numeric: tabular-nums; text-align: right; }
    tr:last-child td { border-bottom: none; }
    .pos { color: var(--positive); font-weight: 650; }
    .neg { color: var(--negative); font-weight: 650; }
    .muted { color: var(--ink-muted); }
    .empty {
      padding: 1.25rem 1.1rem;
      color: var(--ink-muted);
      font-size: 0.9rem;
    }
    .error-box {
      margin: 1.5rem;
      padding: 1rem 1.1rem;
      border-radius: 10px;
      border: 1px solid #fecaca;
      background: #fef2f2;
      color: var(--negative);
    }
    .hidden { display: none; }
    .footer {
      text-align: center;
      font-size: 0.75rem;
      color: var(--ink-soft);
      padding: 0.5rem 1rem 1.5rem;
    }
    @media (max-width: 640px) {
      .container { padding: 1rem; }
      th, td { padding: 0.55rem 0.6rem; }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Watch List</h1>
    <div class="subtitle" id="subtitle">Loading…</div>
  </div>
  <div class="controls">
    <button type="button" id="refreshBtn">Refresh</button>
  </div>
  <p class="status" id="status"></p>
  <div class="container">
    <div id="error" class="error-box hidden">Could not load watch list. Sign in and try again.</div>
    <div id="page" class="hidden">
      <section class="section" aria-label="Discovery universe">
        <div class="section-title">Universe</div>
        <div class="chip-block">
          <div class="chip-label">Markets</div>
          <div class="chips" id="markets"></div>
        </div>
        <div class="chip-block">
          <div class="chip-label">Sectors</div>
          <div class="chips" id="sectors"></div>
        </div>
        <div class="chip-block">
          <div class="chip-label">Themes</div>
          <div class="chips" id="themes"></div>
        </div>
      </section>
      <section class="section" aria-label="Named products">
        <div class="section-title">Products</div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Symbol</th>
                <th class="num">Last</th>
                <th class="num">Change</th>
                <th class="num">%</th>
                <th>Note</th>
                <th>Added</th>
              </tr>
            </thead>
            <tbody id="tbody"></tbody>
          </table>
          <div id="empty" class="empty hidden">
            No named products yet. In chat: add AAPL to my watch list.
          </div>
        </div>
      </section>
    </div>
  </div>
  <p class="footer">Yahoo Finance · Educational only — not licensed financial advice</p>
  <script src="app.js"></script>
</body>
</html>
