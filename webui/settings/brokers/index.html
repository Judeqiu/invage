<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Brokers</title>
  <link rel="stylesheet" href="../../report.css" />
  <style>
    html, body { height: 100%; overflow-y: auto; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      padding: 16px;
      font-size: 13px;
      background-attachment: scroll;
    }
    .error {
      color: #9f1239;
      background: #fff1f2;
      border: 1px solid #fecdd3;
      border-radius: 8px;
      padding: 8px 10px;
      margin-bottom: 10px;
      white-space: pre-wrap;
    }
    .hint { color: #78716c; font-size: 11px; }
    .connector {
      border: 1px solid #e7e5e4;
      border-radius: 10px;
      padding: 12px;
      margin-top: 10px;
    }
    .connector:first-child { margin-top: 0; }
    .card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
    .title { font-size: 14px; font-weight: 600; }
    .manage { margin-top: 10px; padding-top: 10px; border-top: 1px solid #e7e5e4; }
    .cap {
      color: #57534e;
      font-size: 11px;
      margin-top: 2px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 10px;
    }
    .chip {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      border-radius: 999px;
      padding: 2px 8px;
      border: 1px solid #e7e5e4;
      color: #57534e;
    }
    .chip.off { background: #f5f5f4; }
    .chip.needs_credentials { background: #fffbeb; border-color: #fde68a; color: #92400e; }
    .chip.connected { background: #ecfdf5; border-color: #a7f3d0; color: #065f46; }
    .chip.error { background: #fff1f2; border-color: #fecdd3; color: #9f1239; }
    label.field {
      display: block;
      margin-top: 8px;
      font-size: 11px;
      font-weight: 600;
      color: #44403c;
    }
    label.field span.help { display: block; font-weight: 400; color: #78716c; margin-top: 2px; }
    input[type="text"], input[type="password"], textarea, select {
      width: 100%;
      margin-top: 4px;
      border: 1px solid #e7e5e4;
      border-radius: 8px;
      padding: 6px 8px;
      font-size: 13px;
    }
    textarea { min-height: 5.5rem; font-family: ui-monospace, monospace; }
    .account-picker { border-top: 1px solid #e7e5e4; margin-top: 14px; padding-top: 10px; }
    .account-picker .hint { margin: 5px 0 8px; line-height: 1.5; }
    .account-message { color: #9f1239; font-size: 11px; line-height: 1.5; }
    .toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
    }
    details { margin-top: 10px; font-size: 11px; color: #57534e; }
    details ol { margin: 6px 0 0 18px; }
    .setup-guide { padding: 10px 12px; border: 1px solid #bfdbfe; border-radius: 8px; background: #eff6ff; color: #1e3a5f; line-height: 1.5; }
    .setup-guide summary { font-size: 12px; font-weight: 700; cursor: pointer; }
    .setup-guide li { margin: 6px 0; }
    .setup-guide p { margin-top: 7px; }
    .setup-prerequisite { color: #1e3a5f; }
    .setup-guide a { color: #1d4ed8; }
    .actions { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
    button {
      font-size: 11px;
      border-radius: 8px;
      border: 1px solid #e7e5e4;
      background: #fafaf9;
      padding: 6px 10px;
      cursor: pointer;
      color: #1c1917;
    }
    button.primary { background: #1c1917; color: #fff; border-color: #1c1917; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .actions a {
      font-size: 11px;
      border-radius: 8px;
      border: 1px solid #e7e5e4;
      background: #fafaf9;
      padding: 6px 10px;
      color: #1c1917;
      text-decoration: none;
    }
    .last { margin-top: 8px; font-size: 11px; color: #57534e; }
    .manage h3 { font-size: 12px; margin-top: 16px; }
    .sync-history { margin: 8px 0; border: 1px solid #e7e5e4; border-radius: 8px; overflow: hidden; }
    .sync-run { padding: 8px; line-height: 1.5; border-bottom: 1px solid #e7e5e4; }
    .sync-run:last-child { border-bottom: 0; }
    .sync-run a { color: #1c1917; font-size: 11px; }
    body { max-width: 1040px; margin: 0 auto; padding: 24px; }
    .page-header { margin-bottom: 20px; }
    .page-header h1 { font-size: 22px; letter-spacing: -.025em; margin-bottom: 6px; }
    .hint, .cap, .last, details { font-size: 12px; line-height: 1.6; }
    .connector { padding: 20px; margin-top: 16px; background: #fff; box-shadow: 0 2px 6px #1c191705; }
    .card-head > div { min-width: 0; }
    .title { font-size: 16px; overflow-wrap: anywhere; }
    .cap { display: block; overflow: visible; overflow-wrap: anywhere; }
    .chip { flex-shrink: 0; padding: 4px 10px; }
    .sync-controls { margin-top: 16px; padding-top: 14px; border-top: 1px solid #e7e5e4; }
    .sync-controls .actions { margin-top: 0; margin-bottom: 8px; }
    .actions:empty { display: none; }
    button, .actions a { min-height: 40px; font-size: 12px; padding: 9px 14px; }
    button { display: inline-flex; align-items: center; justify-content: center; gap: 7px; }
    button:hover:not(:disabled), .actions a:hover { border-color: #a8a29e; }
    :is(button, a, input, textarea, select, summary):focus-visible { outline: 3px solid #2563eb; outline-offset: 3px; }
    .syncing { border-color: #93c5fd; }
    .syncing button:has(.spinner):disabled { opacity: 1; color: #1e3a5f; background: #eff6ff; border-color: #bfdbfe; }
    .sync-feedback { margin: 16px 0; padding: 16px; border: 1px solid #bfdbfe; border-radius: 10px; background: #eff6ff; color: #1e3a5f; line-height: 1.6; overflow-wrap: anywhere; }
    .sync-feedback p { margin-top: 5px; font-size: 12px; }
    .feedback-heading { display: flex; align-items: center; gap: 9px; }
    .sync-feedback.success { background: #ecfdf5; border-color: #a7f3d0; color: #065f46; }
    .sync-feedback.attention { background: #fffbeb; border-color: #fde68a; color: #92400e; }
    .spinner { display: inline-block; width: 16px; height: 16px; flex-shrink: 0; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .85s linear infinite; }
    .sync-progress { height: 4px; overflow: hidden; background: #dbeafe; border-radius: 4px; margin: 12px 0 6px; }
    .sync-progress span { display: block; width: 35%; height: 100%; background: #2563eb; border-radius: inherit; animation: progress 1.6s ease-in-out infinite alternate; }
    .elapsed { font-size: 11px; font-variant-numeric: tabular-nums; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes progress { from { transform: translateX(-100%); } to { transform: translateX(285%); } }
    @media (prefers-reduced-motion: reduce) { .spinner, .sync-progress span { animation: none; } .sync-progress span { width: 100%; opacity: .6; } }
    @media (max-width: 480px) { body { padding: 16px; } .connector { padding: 16px; } .card-head { flex-wrap: wrap; } .actions { gap: 8px; } .sync-controls button { flex: 1; } }
  </style>
</head>
<body>
  <header class="page-header"><h1>Broker accounts</h1><p class="hint">Manage your connections, refresh account data and import broker history.</p></header>
  <div id="error" class="error" role="alert" hidden></div>
  <section id="sync-feedback" role="status" aria-live="polite" aria-atomic="true" hidden></section>
  <div id="list"></div>
  <script src="accounts.js?v=20261101-sync-feedback"></script>
</body>
</html>
