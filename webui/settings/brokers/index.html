<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Brokers</title>
  <style>
    html, body { height: 100%; overflow-y: auto; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #1c1917;
      background: #fff;
      padding: 16px;
      font-size: 13px;
      line-height: 1.45;
    }
    .error {
      color: #9f1239;
      background: #fff1f2;
      border: 1px solid #fecdd3;
      border-radius: 8px;
      padding: 8px 10px;
      margin-bottom: 10px;
      white-space: pre-wrap;
    }
    .hint { color: #78716c; font-size: 11px; }
    .connector {
      border: 1px solid #e7e5e4;
      border-radius: 10px;
      padding: 12px;
      margin-top: 10px;
    }
    .connector:first-child { margin-top: 0; }
    .card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
    .title { font-size: 14px; font-weight: 600; }
    .manage { margin-top: 10px; padding-top: 10px; border-top: 1px solid #e7e5e4; }
    .cap {
      color: #57534e;
      font-size: 11px;
      margin-top: 2px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 10px;
    }
    .chip {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      border-radius: 999px;
      padding: 2px 8px;
      border: 1px solid #e7e5e4;
      color: #57534e;
    }
    .chip.off { background: #f5f5f4; }
    .chip.needs_credentials { background: #fffbeb; border-color: #fde68a; color: #92400e; }
    .chip.connected { background: #ecfdf5; border-color: #a7f3d0; color: #065f46; }
    .chip.error { background: #fff1f2; border-color: #fecdd3; color: #9f1239; }
    label.field {
      display: block;
      margin-top: 8px;
      font-size: 11px;
      font-weight: 600;
      color: #44403c;
    }
    label.field span.help { display: block; font-weight: 400; color: #78716c; margin-top: 2px; }
    input[type="text"], input[type="password"], textarea {
      width: 100%;
      margin-top: 4px;
      border: 1px solid #e7e5e4;
      border-radius: 8px;
      padding: 6px 8px;
      font-size: 13px;
    }
    textarea { min-height: 5.5rem; font-family: ui-monospace, monospace; }
    .toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
    }
    details { margin-top: 10px; font-size: 11px; color: #57534e; }
    details ol { margin: 6px 0 0 18px; }
    .actions { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
    button {
      font-size: 11px;
      border-radius: 8px;
      border: 1px solid #e7e5e4;
      background: #fafaf9;
      padding: 6px 10px;
      cursor: pointer;
      color: #1c1917;
    }
    button.primary { background: #1c1917; color: #fff; border-color: #1c1917; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .actions a {
      font-size: 11px;
      border-radius: 8px;
      border: 1px solid #e7e5e4;
      background: #fafaf9;
      padding: 6px 10px;
      color: #1c1917;
      text-decoration: none;
    }
    .last { margin-top: 8px; font-size: 11px; color: #57534e; }
  </style>
</head>
<body>
  <p class="hint" style="margin-bottom:10px">
    <a href="/brokers/guide" target="_parent">Setup guide</a> — how to get Interactive Brokers, Tiger, and MooMoo credentials.
  </p>
  <div id="error" class="error" hidden></div>
  <div id="list"></div>
  <script src="app.js"></script>
</body>
</html>
