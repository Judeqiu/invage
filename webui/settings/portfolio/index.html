<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Portfolio settings</title>
  <link rel="stylesheet" href="../../report.css" />
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 16px; background: transparent; font: 13px Inter, system-ui, sans-serif; color: #1c1917; }
    .field { display: flex; align-items: end; gap: 10px; flex-wrap: wrap; }
    label { display: grid; gap: 6px; font-weight: 600; }
    select { min-width: 210px; padding: 8px 10px; border: 1px solid #d6d3d1; border-radius: 8px; background: white; font: inherit; }
    button { padding: 8px 14px; border: 0; border-radius: 8px; color: white; background: #171f30; font: inherit; cursor: pointer; }
    button:disabled { opacity: .5; cursor: default; }
    p { margin: 10px 0 0; color: #57534e; line-height: 1.5; }
    #message { min-height: 20px; }
    #message.error { color: #9f1239; }
  </style>
</head>
<body>
  <form id="form">
    <div class="field">
      <label for="currency">Reporting currency
        <select id="currency" required disabled>
          <option value="">Choose currency</option>
          <option value="USD" selected>USD — US dollar</option>
          <option value="SGD">SGD — Singapore dollar</option>
          <option value="HKD">HKD — Hong Kong dollar</option>
          <option value="CNH">CNH — offshore yuan</option>
          <option value="JPY">JPY — Japanese yen</option>
          <option value="KRW">KRW — Korean won</option>
          <option value="EUR">EUR — euro</option>
          <option value="GBP">GBP — British pound</option>
          <option value="AUD">AUD — Australian dollar</option>
          <option value="CAD">CAD — Canadian dollar</option>
        </select>
      </label>
      <button id="save" type="submit" disabled>Save</button>
    </div>
    <p>Portfolio totals use this currency, with USD as the default. Broker balances and positions stay in their original currencies. Live FX rates are shown on the dashboard.</p>
    <p id="message" role="status"></p>
  </form>
  <script src="./app.js"></script>
</body>
</html>
