# Install as /etc/systemd/system/victorconsultant.service.d/node-compile-cache.conf.
# Prepare /var/cache/velovest/node-compile owned by velovest, mode 0700, and
# warm imports before restarting. The cache is disposable and contains no data.
[Service]
Environment=NODE_COMPILE_CACHE=/var/cache/velovest/node-compile
